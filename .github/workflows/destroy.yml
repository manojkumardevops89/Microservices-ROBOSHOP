name: Destroy-Pipeline
on:
  workflow_dispatch:

jobs:
  destroy-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name roboshop-eks

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Uninstall Helm Releases
        run: |
          helm uninstall frontend catalogue user cart shipping mongodb mysql redis rabbitmq \
            -n roboshop --ignore-not-found

      - name: Delete Namespace
        run: |
          kubectl delete namespace roboshop --ignore-not-found

      - name: Delete ACM Certificate
        run: |
          aws acm delete-certificate \
            --certificate-arn arn:aws:acm:us-east-1:987078319369:certificate/4a873a87-0db0-4e84-a1d0-b75076a2a9f8 \
            --region us-east-1

  destroy-terraform:
    runs-on: ubuntu-latest
    needs: destroy-helm
    defaults:
      run:
        working-directory: Terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -lock=false
