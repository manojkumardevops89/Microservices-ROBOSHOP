name: Destroy-Infrastructure

on:
  workflow_dispatch:  # Manual trigger only - won't run automatically

jobs:

  helm-destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name roboshop-eks

      - name: Uninstall Helm Releases
        run: |
          for service in frontend shipping user catalogue cart; do
            helm uninstall $service --namespace roboshop --ignore-not-found
          done

      - name: Delete Namespace
        run: |
          kubectl delete namespace roboshop --ignore-not-found

  terraform-destroy:
    runs-on: ubuntu-latest
    needs: helm-destroy        # Wait for Helm cleanup first
    defaults:
      run:
        working-directory: Terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -lock=false
