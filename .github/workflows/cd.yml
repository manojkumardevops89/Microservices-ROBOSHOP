name: CD-Pipeline
on:
  workflow_run:
    workflows: ["CI-Pipeline"]
    types:
      - completed
jobs:
  terraform-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -lock=false
      - name: Terraform Apply
        run: terraform apply -auto-approve -lock=false
  helm-deploy:
    runs-on: ubuntu-latest
    needs: terraform-deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name roboshop-eks
      - name: Create JFrog ImagePullSecret
        run: |
          kubectl create secret docker-registry jfrog-secret \
            --docker-server=${{ secrets.JFROG_REGISTRY }} \
            --docker-username=${{ secrets.JFROG_USERNAME }} \
            --docker-password=${{ secrets.JFROG_PASSWORD }} \
            --namespace=roboshop \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Install Helm
        uses: azure/setup-helm@v3
      - name: Deploy all services
        run: |
          for service in cart catalogue frontend shipping user; do
            helm upgrade --install $service ./helm/$service \
              --namespace roboshop \
              --create-namespace \
              --set image.tag=latest \
              --wait
          done
