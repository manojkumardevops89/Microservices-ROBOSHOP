name: CI-Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.

      # ── Java Build (shipping only) ─────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Shipping JAR with Maven
        run: mvn clean package -DskipTests -f ./services/shipping/pom.xml

      # ── Docker Builds ──────────────────────────────────────────────────────
      - name: Build User Service
        run: docker build -t user-service ./services/user

      - name: Build Cart Service
        run: docker build -t cart-service ./services/cart

      - name: Build Catalogue Service
        run: docker build -t catalogue-service ./services/catalogue

      - name: Build Shipping Service
        run: docker build -t shipping-service ./services/shipping

      - name: Build Frontend
        run: docker build -t frontend ./services/frontend

      # ── Trivy Security Scans ───────────────────────────────────────────────
      - name: Trivy Scan User Service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: user-service:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Trivy Scan Cart Service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cart-service:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Trivy Scan Catalogue Service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: catalogue-service:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Trivy Scan Shipping Service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shipping-service:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # ── JFrog Login ────────────────────────────────────────────────────────
      - name: Login to JFrog
        run: |
          docker login yourcompany.jfrog.io \
            -u ${{ secrets.JFROG_USERNAME }} \
            -p ${{ secrets.JFROG_PASSWORD }}

      # ── Tag Docker Images ──────────────────────────────────────────────────
      - name: Tag Docker Images
        run: |
          docker tag user-service yourcompany.jfrog.io/docker/user-service:${{ github.run_number }}
          docker tag cart-service yourcompany.jfrog.io/docker/cart-service:${{ github.run_number }}
          docker tag catalogue-service yourcompany.jfrog.io/docker/catalogue-service:${{ github.run_number }}
          docker tag shipping-service yourcompany.jfrog.io/docker/shipping-service:${{ github.run_number }}
          docker tag frontend yourcompany.jfrog.io/docker/frontend:${{ github.run_number }}

          docker tag user-service yourcompany.jfrog.io/docker/user-service:latest
          docker tag cart-service yourcompany.jfrog.io/docker/cart-service:latest
          docker tag catalogue-service yourcompany.jfrog.io/docker/catalogue-service:latest
          docker tag shipping-service yourcompany.jfrog.io/docker/shipping-service:latest
          docker tag frontend yourcompany.jfrog.io/docker/frontend:latest

      # ── Push Docker Images ─────────────────────────────────────────────────
      - name: Push Docker Images
        run: |
          docker push yourcompany.jfrog.io/docker/user-service:${{ github.run_number }}
          docker push yourcompany.jfrog.io/docker/cart-service:${{ github.run_number }}
          docker push yourcompany.jfrog.io/docker/catalogue-service:${{ github.run_number }}
          docker push yourcompany.jfrog.io/docker/shipping-service:${{ github.run_number }}
          docker push yourcompany.jfrog.io/docker/frontend:${{ github.run_number }}

          docker push yourcompany.jfrog.io/docker/user-service:latest
          docker push yourcompany.jfrog.io/docker/cart-service:latest
          docker push yourcompany.jfrog.io/docker/catalogue-service:latest
          docker push yourcompany.jfrog.io/docker/shipping-service:latest
          docker push yourcompany.jfrog.io/docker/frontend:latest
